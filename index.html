<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambani Tool - Premium VIP Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .badge {
    display: inline-block;
    background: #00ff88;
    color: #000;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 15px;
  }
  h1 { font-size: 26px; margin-bottom: 5px; letter-spacing: 1px; }
  .subtitle { color: #00ff88; font-size: 13px; letter-spacing: 2px; margin-bottom: 25px; }
  .price-old { text-decoration: line-through; color: #888; font-size: 16px; }
  .price-new { font-size: 42px; font-weight: bold; color: #00ff88; margin: 5px 0 15px; }
  .timer {
    background: rgba(255,0,0,0.15);
    border: 1px solid rgba(255,0,0,0.4);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #ff6b6b;
  }
  .timer span { font-size: 22px; font-weight: bold; display: block; margin-top: 5px; }
  .features {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
    font-size: 11px;
    color: #aaa;
  }
  .features div { flex: 1; }
  .features div::before {
    content: "●";
    display: block;
    color: #00ff88;
    font-size: 18px;
    margin-bottom: 5px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, #00ff88, #00cc6a);
    color: #000;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 10px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,255,136,0.4); }
  .small { font-size: 11px; color: #777; margin-top: 15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">LIVE ACCESS AVAILABLE</div>
    <h1>ZETA NUMBER PANEL</h1>
    <div class="subtitle">PREMIUM VIP PANEL</div>

    <div class="price-old">Regular Price ₹2999</div>
    <div style="font-size:12px; color:#ff6b6b;">LIMITED TIME OFFER</div>
    <div class="price-new">₹0</div>

    <div class="timer">
      FREE ACCESS EXPIRES IN
      <span id="countdown">00:16</span>
    </div>

    <div class="features">
      <div>PREMIUM<br>ACCESS</div>
      <div>SECURE<br>DOWNLOAD</div>
      <div>FAST<br>ACCESS</div>
    </div>

    <!-- DOWNLOAD BUTTON — will point to your APK -->
    <a href="https://github.com/recovery200013-hub/zetagamer/releases/download/v1.0/zeta-number.apk" download class="btn">DOWNLOAD NOW</a>

    <div class="small">50K+ USERS • 24/7 SUPPORT • 100% SECURE</div>
  </div>

<script>
  // Countdown timer
  let time = 16;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    time--;
    const m = String(Math.floor(time / 60)).padStart(2, '0');
    const s = String(time % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
    if (time <= 0) { clearInterval(timer); el.textContent = "EXPIRED"; }
  }, 1000);
</script>
</body>
</html>
